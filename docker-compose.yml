services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: res_nam}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10}
  app:
    build: .
    depends_on: {db: {condition: service_healthy}}
    ports: ["8080:8080"]
    environment: {DB_HOST: db, DB_PORT: "5432", DB_USER: postgres, DB_PASSWORD: postgres, DB_NAME: res_nam, JWT_SECRET: change-me, PORT: "8080"}
